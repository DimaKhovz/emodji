<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Emodji Magnet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0d0f1f;
    --bg2: #1a1740;
    --glass: rgba(255,255,255,.07);
    --glass-b: rgba(255,255,255,.16);
    --text: #f2f3ff;
    --muted: #8d90b8;
    --accent: #7c8cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: Inter, system-ui, "Segoe UI", sans-serif;
    color: var(--text);
    background: radial-gradient(1200px 700px at 50% 0%, var(--bg2), var(--bg1) 70%);
  }
  canvas#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #bar {
    position: fixed; left: 50%; top: 15vh; transform: translateX(-50%);
    width: min(920px, 82vw); z-index: 5;
  }
  #hint { font-size: 13px; color: var(--muted); margin: 0 6px 8px; display: flex; justify-content: space-between; min-height: 18px; }
  #status { transition: color .2s; }
  #status.err { color: #ff8a8a; }
  #field {
    width: 100%; font: 500 28px/1.25 Inter, system-ui, sans-serif; color: var(--text);
    background: var(--glass); border: 1px solid var(--glass-b); border-bottom: none;
    border-radius: 18px 18px 0 0; padding: 18px 24px; outline: none;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    caret-color: var(--accent);
  }
  #field::placeholder { color: #6b6f9c; font-weight: 400; }
  #field:focus { background: rgba(255,255,255,.1); }

  /* type=search keeps Chrome's password/card/address bar off the keyboard; strip its native look */
  input[type="search"] { -webkit-appearance: none; appearance: none; }
  input[type="search"]::-webkit-search-cancel-button,
  input[type="search"]::-webkit-search-decoration,
  input[type="search"]::-webkit-search-results-button,
  input[type="search"]::-webkit-search-results-decoration { display: none; -webkit-appearance: none; }
  #tools {
    position: fixed; left: 16px; right: 16px; top: 16px; z-index: 6;
    display: flex; justify-content: space-between; gap: 8px; pointer-events: none;
  }
  #tools > div { display: flex; gap: 6px; pointer-events: auto; }
  .tbtn {
    height: 40px; min-width: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--glass-b);
    background: var(--glass); color: var(--text); font: 500 14px Inter, sans-serif; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .tbtn:hover { background: rgba(255,255,255,.14); }
  .tbtn.on { background: rgba(124,140,255,.28); border-color: var(--accent); }
  #acts .tbtn { padding: 0; font-size: 17px; }

  #histPanel {
    position: fixed; z-index: 8; right: 16px; top: 64px; width: min(380px, calc(100vw - 20px));
    max-height: 55vh; overflow-y: auto; display: none; padding: 6px;
    background: rgba(18,20,48,.97); border: 1px solid var(--glass-b); border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  #histPanel.open { display: block; }
  .hitem {
    width: 100%; display: grid; gap: 2px; text-align: left; padding: 9px 10px; border: none; border-radius: 10px;
    background: transparent; color: var(--text); cursor: pointer; font: 14px Inter, sans-serif;
  }
  .hitem:hover { background: rgba(255,255,255,.07); }
  .ht { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .he { font: 16px "Noto Color Emoji","Segoe UI Emoji",sans-serif; letter-spacing: 1px; }
  .hempty { padding: 14px; color: var(--muted); font-size: 13px; }
  .hclear { width: 100%; margin-top: 4px; padding: 8px; border: none; background: none; color: var(--muted); font: 12px Inter, sans-serif; cursor: pointer; }

  #searchBar {
    position: fixed; left: 16px; right: 16px; top: 16px; z-index: 9; display: none; gap: 8px;
  }
  #searchBar.open { display: flex; }
  #searchInput {
    flex: 1; min-width: 0; height: 40px; padding: 0 14px; border-radius: 12px; outline: none;
    border: 1px solid var(--accent); background: rgba(18,20,48,.96); color: var(--text); font: 500 15px Inter, sans-serif;
  }
  body.mobile #searchBar { top: calc(var(--vvt, 0px) + 8px); left: 10px; right: 10px; }
  body.mobile #searchInput { height: 36px; font-size: 16px; }
  #coach {
    position: fixed; z-index: 9; display: none; width: min(440px, calc(100vw - 20px)); padding: 12px 14px;
    background: rgba(18,20,48,.97); border: 1px solid var(--glass-b); border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  #coach.open { display: block; }
  #coach .ch { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  #coach.fix .ch { color: #ffd479; }
  #coach.good .ch { color: #7df0b0; }
  #coachClose { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  .cold { font-size: 14px; color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(255,120,120,.7); }
  .cfix { font-size: 16px; font-weight: 500; margin: 3px 0; }
  .cnote { font-size: 13px; color: var(--muted); line-height: 1.4; }
  #coachActions { display: flex; gap: 8px; margin-top: 10px; }
  #coachActions:empty { display: none; }
  #coachActions button {
    font: 600 13px Inter, sans-serif; padding: 8px 12px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--glass-b); background: rgba(255,255,255,.06); color: var(--text);
  }
  #coachActions button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d24; }
  #setupHint { display: none; padding: 12px 14px; border-radius: 12px; background: rgba(124,140,255,.16);
    border: 1px solid var(--accent); font-size: 14px; line-height: 1.45; }
  #setupHint.show { display: block; }
  #setupHint ol { margin: 6px 0 6px 20px; padding: 0; }
  #setupHint span { color: var(--muted); font-size: 12px; }

  #welcome { position: fixed; inset: 0; z-index: 35; display: none; place-items: center; background: rgba(5,6,18,.78);
    backdrop-filter: blur(6px); overflow-y: auto; padding: 14px; }
  #welcome.open { display: grid; }
  #wcard { width: min(520px, 100%); max-height: 100%; overflow-y: auto; background: #15173a; border: 1px solid var(--glass-b);
    border-radius: 20px; padding: 22px 22px 0; font-size: 14px; line-height: 1.5; }
  #wcard h2 { margin: 0 0 8px; font-size: 20px; }
  #wcard p { margin: 6px 0; }
  .wlead { font-size: 15px; }
  .wbox { margin: 12px 0; padding: 12px 14px; border-radius: 14px; background: rgba(255,214,120,.1); border: 1px solid rgba(255,214,120,.35); }
  .wbox b:first-child { color: #ffd479; }
  .wh { display: block; margin: 14px 0 4px; }
  #wcard ul { margin: 0; padding-left: 20px; }
  #wcard li { margin: 5px 0; }
  .wrow { position: sticky; bottom: 0; margin: 12px -22px 0; padding: 12px 22px; background: #15173a; border-top: 1px solid var(--glass-b); }
  #wOk { width: 100%; font: 600 15px Inter, sans-serif; padding: 12px; border-radius: 12px; border: none; cursor: pointer;
    background: var(--accent); color: #0b0d24; }
  body:not(.mobile) #wcard .mobileOnly { display: none; }
  #hint { align-items: center; gap: 8px; }
  #status { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hint .hr { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }
  #diffBtn { font: 600 12px Inter, sans-serif; padding: 4px 10px; border-radius: 99px; cursor: pointer; color: var(--text);
    border: 1px solid var(--glass-b); background: var(--glass); }
  #diffBtn.on { background: rgba(255,214,120,.18); border-color: rgba(255,214,120,.6); color: #ffd479; }
  /* rocker switch for the fire: calm when idle, springy click when pressed (lives in the hint row) */
  .fireSw { display: inline-flex; align-items: center; gap: 5px; }
  .fireSw::before { content: '🔥'; font: 12px "Noto Color Emoji","Segoe UI Emoji",sans-serif; opacity: .8; }
  .fireSw.off::before { filter: grayscale(1); opacity: .4; }
  #fireBtn {
    position: relative; flex: none; width: 46px; height: 26px; padding: 0; border-radius: 13px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.1);
    background: linear-gradient(180deg, #0b0d20, #171a38);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.75), inset 0 -1px 0 rgba(255,255,255,.05), 0 1px 0 rgba(255,255,255,.06);
    -webkit-tap-highlight-color: transparent; outline: none;
  }
  #fireBtn .cap {
    position: absolute; top: 2px; left: 2px; width: 26px; height: 20px; border-radius: 10px;
    background: linear-gradient(145deg, #5a6096, #353a72 62%, #2a2e60);
    box-shadow: 0 2px 4px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.3), inset 0 -2px 3px rgba(0,0,0,.3);
    transition: left .24s cubic-bezier(.3,1.7,.5,1), transform .12s ease-out;
    display: grid; place-items: center;
  }
  #fireBtn.on .cap { left: 16px; }
  #fireBtn:active .cap { transform: scaleX(1.1) scaleY(.92); }
  #fireBtn .dot { width: 4px; height: 4px; border-radius: 50%; background: #4a4f86; box-shadow: inset 0 1px 1px rgba(0,0,0,.5); transition: background .2s, box-shadow .2s; }
  #fireBtn.on .dot { background: #ffb457; box-shadow: 0 0 5px rgba(255,160,60,.8); }
  #fireBtn:focus-visible { box-shadow: inset 0 2px 4px rgba(0,0,0,.75), 0 0 0 2px var(--accent); }
  /* hand-drawn icons (images live in icons.css) */
  .ic { display: inline-block; flex: none; width: 26px; height: 26px; background: center / contain no-repeat; pointer-events: none; }
  .tbtn .ic { filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }
  .ic.sm { width: 1.2em; height: 1.2em; vertical-align: -.25em; margin: 0 1px; }
  body.mobile .tbtn .ic { width: 22px; height: 22px; }
  .tbtn .ico { width: 26px; height: 26px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }
  body.mobile .tbtn .ico { width: 22px; height: 22px; }
  .icoSlot { display: inline-flex; }
  /* no native blue tap-highlight square / text-like selection on the panel buttons and their icons */
  .tbtn, #tools, #tools * , #diffBtn, #fireBtn, #searchClose {
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
  }
  .tbtn { outline: none; }
  .tbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ico, .ico * { -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
  #chips { position: fixed; z-index: 4; display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; transition: opacity .25s; }
  #chips::-webkit-scrollbar { display: none; }
  #chips.hide { opacity: 0; pointer-events: none; }
  .chip { flex: none; font: 500 13px Inter, system-ui, sans-serif; padding: 7px 13px; border-radius: 99px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--glass-b); background: var(--glass); color: var(--text); backdrop-filter: blur(8px); -webkit-tap-highlight-color: transparent; }
  .chip:hover { background: rgba(255,255,255,.14); }
  #tryBtn { display: none; width: 100%; font: 600 14px Inter, sans-serif; padding: 11px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--accent); background: rgba(124,140,255,.18); color: var(--text); }
  #tryBtn.show { display: block; }
  .tbtn.dim { opacity: .38; }
  .tbtn.busy { opacity: .6; pointer-events: none; }
  .lrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); }
  #langSel { display: flex; gap: 6px; }
  #card #langSel button { padding: 7px 14px; font-size: 13px; }
  #card #langSel button.on { background: var(--accent); border-color: var(--accent); color: #0b0d24; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; z-index: 40; transform: translate(-50%, 20px); opacity: 0;
    padding: 10px 16px; border-radius: 12px; background: rgba(18,20,48,.95); border: 1px solid var(--glass-b);
    font-size: 14px; max-width: calc(100vw - 40px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: opacity .2s, transform .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  #field.shake { animation: shake .35s; }
  #field[readonly] { color: #c9cdf7; }
  #tip {
    position: fixed; z-index: 6; pointer-events: none; padding: 5px 10px; border-radius: 8px;
    background: rgba(10,12,30,.9); border: 1px solid var(--glass-b); font-size: 13px; opacity: 0;
    transition: opacity .12s; white-space: nowrap;
  }

  #bubble {
    position: fixed; z-index: 7; width: 340px; display: none; padding: 14px 16px;
    background: rgba(18,20,48,.94); border: 1px solid var(--glass-b); border-radius: 16px;
    backdrop-filter: blur(14px); box-shadow: 0 10px 40px rgba(0,0,0,.4);
  }
  #bubble.open { display: block; }
  #bubble .bh { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  #bEmoji { font: 26px "Noto Color Emoji","Segoe UI Emoji",sans-serif; }
  #bVerdict { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--glass); color: var(--muted); }
  #bVerdict.yes { background: rgba(80,220,140,.18); color: #7df0b0; }
  #bVerdict.no { background: rgba(255,120,120,.18); color: #ff9a9a; }
  #bSpeak { margin-left: auto; background: none; border: none; font-size: 16px; cursor: pointer; opacity: .8; padding: 0 4px; }
  #bSpeak + #bClose { margin-left: 0; }
  #bClose { margin-left: auto; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  #bText { white-space: pre-line; margin: 0 0 10px; font-size: 14px; line-height: 1.4; min-height: 20px; }
  #bArg {
    width: 100%; font: 13px Inter, sans-serif; color: var(--text); background: rgba(255,255,255,.06);
    border: 1px solid var(--glass-b); border-radius: 10px; padding: 8px 10px; outline: none;
  }
  #bArg:focus { border-color: var(--accent); }
  #bActions { display: flex; gap: 8px; flex-wrap: wrap; }
  #bActions:not(:empty) { margin-top: 10px; }
  #bActions button {
    font: 600 13px Inter, sans-serif; padding: 8px 12px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--glass-b); background: rgba(255,255,255,.06); color: var(--text);
  }
  #bActions button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d24; }
  #loading {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: var(--bg1); color: var(--muted); font-size: 16px; transition: opacity .5s;
  }
  #loading.hide { opacity: 0; pointer-events: none; }

  #modal { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; background: rgba(5,6,18,.7); backdrop-filter: blur(6px); }
  #modal.open { display: grid; }
  #card {
    width: min(460px, 92vw); background: #15173a; border: 1px solid var(--glass-b);
    border-radius: 18px; padding: 24px; display: grid; gap: 12px;
  }
  #card h2 { margin: 0 0 4px; font-size: 18px; }
  #card label { font-size: 12px; color: var(--muted); display: grid; gap: 6px; }
  #card input {
    font: 15px Inter, sans-serif; color: var(--text); background: rgba(255,255,255,.06);
    border: 1px solid var(--glass-b); border-radius: 10px; padding: 11px 12px; outline: none;
  }
  #card input:focus { border-color: var(--accent); }
  #card .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  #card button {
    font: 600 14px Inter, sans-serif; border-radius: 10px; padding: 10px 18px; cursor: pointer;
    border: 1px solid var(--glass-b); background: transparent; color: var(--text);
  }
  #card button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d24; }
  #card .linkbtn { border: none !important; background: none !important; color: var(--muted) !important; font-size: 12px !important; text-align: left; padding: 0 !important; text-decoration: underline; }
  #card small { color: var(--muted); font-size: 12px; line-height: 1.4; }
  #card .opt { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text); cursor: pointer; }
  #card .opt input { width: 18px; height: 18px; padding: 0; accent-color: var(--accent); }
  body:not(.mobile) .mobileOnly { display: none !important; }

  /* ---- phone mode (desktop untouched) ---- */
  body.mobile canvas#world { inset: auto; left: 0; top: var(--vvt, 0px); width: 100%; height: var(--vvh, 100%); }
  body.mobile #bar { top: calc(var(--vvt, 0px) + 54px); width: calc(100vw - 20px); }
  body.mobile #hint { font-size: 12px; margin-bottom: 5px; min-height: 15px; }
  body.mobile #count { display: none; }
  #ver { opacity: .35; margin-left: 8px; }
  body.mobile #field { font-size: 17px; padding: 11px 14px; border-radius: 14px 14px 0 0; }
  body.mobile #tools { top: calc(var(--vvt, 0px) + 8px); left: 10px; right: 10px; }
  body.mobile .tbtn { height: 32px; min-width: 32px; padding: 0; font-size: 16px; }
  body.mobile #tools > div { gap: 4px; }
  body.mobile #modes .tbtn span { display: none; }
  body.mobile #histPanel { right: 10px; top: calc(var(--vvt, 0px) + 50px); }
  body.mobile #bubble { width: calc(100vw - 20px); padding: 11px 13px; }
  body.mobile #bArg { font-size: 16px; }
  /* masked like a password, but without the browser's password/card/address autofill bar */
  .secret { -webkit-text-security: disc; }
  .secret::placeholder { -webkit-text-security: none; }
  /* settings window always fits above the on-screen keyboard and scrolls */
  body.mobile #modal { top: var(--vvt, 0px); bottom: auto; height: var(--vvh, 100%); overflow-y: auto; align-items: start; padding: 8px 0; }
  body.mobile #card { margin: 0 auto; padding: 16px; gap: 10px; }
  body.mobile #card .row { position: sticky; bottom: -16px; margin: 4px -16px -16px; padding: 10px 16px; background: #15173a; border-top: 1px solid var(--glass-b); }
</style>

<body>
<canvas id="world"></canvas>

<div id="bar">
  <div id="hint"><span id="status" data-i18n="status.magnet"></span><span class="hr"><span id="count"></span><span class="fireSw"><button id="fireBtn" type="button" role="switch" aria-checked="true"><span class="cap"><i class="dot"></i></span></button></span><button id="diffBtn" type="button"></button></span></div>
  <input id="field" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="ph.magnet" autofocus>
</div>

<div id="chips"></div>

<div id="tools">
  <div id="modes">
    <button class="tbtn on" data-mode="magnet" data-i18n-title="modeT.magnet"><span class="icoSlot" data-ico="magnet"><i class="ic ic-magnet"></i></span><span data-i18n="mode.magnet"></span></button>
    <button class="tbtn" data-mode="story" data-i18n-title="modeT.story"><span class="icoSlot" data-ico="book"><i class="ic ic-book"></i></span><span data-i18n="mode.story"></span></button>
    <button class="tbtn" data-mode="defend" data-i18n-title="modeT.defend"><span class="icoSlot" data-ico="shield"><i class="ic ic-shield"></i></span><span data-i18n="mode.defend"></span></button>
    <button class="tbtn" data-mode="guess" data-i18n-title="modeT.guess"><span class="icoSlot" data-ico="question"><i class="ic ic-question"></i></span><span data-i18n="mode.guess"></span></button>
  </div>
  <div id="acts">
    <button class="tbtn" id="peelBtn" data-i18n-title="t.peel"><span class="icoSlot" data-ico="scissors"><i class="ic ic-scissors"></i></span></button>
    <button class="tbtn" id="searchBtn" data-i18n-title="t.search"><span class="icoSlot" data-ico="magnifier"><i class="ic ic-magnifier"></i></span></button>
    <button class="tbtn" id="copyBtn" data-i18n-title="t.copy"><span class="icoSlot" data-ico="clipboard"><i class="ic ic-clipboard"></i></span></button>
    <button class="tbtn" id="histBtn" data-i18n-title="t.hist"><span class="icoSlot" data-ico="clock"><i class="ic ic-clock"></i></span></button>
    <button class="tbtn" id="gear" data-i18n-title="t.settings"><span class="icoSlot" data-ico="gear"><i class="ic ic-gear"></i></span></button>
  </div>
</div>
<div id="searchBar"><input id="searchInput" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="search.ph"><button class="tbtn" id="searchClose" data-i18n-title="t.close">✕</button></div>
<div id="histPanel"></div>
<div id="toast"></div>
<div id="coach"><div class="ch"><span id="coachTitle"></span><button id="coachClose" data-i18n-title="t.close">×</button></div><div id="coachBody"></div><div id="coachActions"></div></div>
<div id="tip"></div>
<div id="bubble">
  <div class="bh"><span id="bEmoji"></span><span id="bVerdict"></span><button id="bSpeak" title="Listen">🔊</button><button id="bClose" data-i18n-title="t.close">×</button></div>
  <p id="bText"></p>
  <input id="bArg" type="search" autocomplete="off" spellcheck="false" placeholder="Argue back… (Enter)">
  <div id="bActions"></div>
</div>
<div id="loading" data-i18n="loading"></div>

<div id="welcome">
