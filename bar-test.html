<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Тест полос над клавиатурой</title>
<style>
  body { font: 16px system-ui, sans-serif; background: #0d0f1f; color: #eee; margin: 0; padding: 14px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { color: #9aa; font-size: 14px; margin: 4px 0 12px; }
  .row { margin: 0 0 14px; }
  label { display: block; font-size: 13px; color: #9fb; margin-bottom: 4px; }
  input, textarea, .ce { width: 100%; box-sizing: border-box; font: 16px system-ui, sans-serif; color: #fff;
    background: #1b1e3d; border: 1px solid #4a5090; border-radius: 10px; padding: 11px 12px; outline: none; min-height: 44px; }
  .ce:empty::before { content: attr(data-ph); color: #777; }
</style>
</head>
<body>
<h1>Тест: какое поле не показывает чёрную полосу</h1>
<p>Нажми по очереди на каждое поле. Запомни номера, у которых над клавиатурой <b>нет</b> полосы с ключом, картой и геометкой.</p>

<div class="row"><label>1. Обычное (как сейчас)</label>
  <input type="text" autocomplete="off" placeholder="поле 1"></div>

<div class="row"><label>2. type=search</label>
  <input type="search" autocomplete="off" placeholder="поле 2"></div>

<div class="row"><label>3. autocomplete="nope" + случайное имя</label>
  <input type="text" name="q8x7zk" autocomplete="nope" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="поле 3"></div>

<div class="row"><label>4. readonly до нажатия</label>
  <input type="text" id="ro" readonly autocomplete="off" placeholder="поле 4"></div>

<div class="row"><label>5. textarea</label>
  <textarea rows="1" autocomplete="off" placeholder="поле 5"></textarea></div>

<div class="row"><label>6. contenteditable (не input)</label>
  <div class="ce" contenteditable="plaintext-only" role="textbox" data-ph="поле 6"></div></div>

<div class="row"><label>7. внутри form autocomplete=off</label>
  <form autocomplete="off" onsubmit="return false"><input type="text" name="zz" autocomplete="off" placeholder="поле 7"></form></div>

<div class="row"><label>8. type=url</label>
  <input type="url" autocomplete="off" placeholder="поле 8"></div>

<script>
  const ro = document.getElementById('ro');
  ro.addEventListener('pointerdown', () => { ro.removeAttribute('readonly'); setTimeout(() => ro.focus(), 0); });
</script>
</body>
</html>
